<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拼图工具</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="拼图">
  <meta name="theme-color" content="#2563eb">
</head>
<body>
  <div class="app-layout">
    <header class="upload-region" id="uploadRegion">
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
      <div class="upload-row">
        <div class="upload-grid" id="uploadGrid">
          <div class="upload-placeholder" id="uploadPlaceholder">
            <span class="upload-placeholder-text">点击上传图片</span>
            <span class="upload-placeholder-hint">支持格式：JPG、PNG、GIF、WebP、BMP</span>
          </div>
        </div>
        <div class="upload-toolbar">
          <button type="button" id="mergeButton" disabled>合并</button>
          <button type="button" id="ungroupButton" disabled>拆分</button>
          <button type="button" id="clearButton" disabled>清空</button>
        </div>
      </div>
    </header>

    <div class="workspace">
      <main class="preview-region" id="previewRegion">
        <label class="theme-toggle" title="切换预览区域明暗">
          <input type="checkbox" id="previewThemeToggle">
          <span class="theme-toggle-track"></span>
        </label>
        <canvas id="previewCanvas"></canvas>
      </main>

      <aside class="settings-region" id="settingsRegion">
        <fieldset class="control-group">
          <legend>拼接模式</legend>
          <div class="radio-row">
            <label class="radio-label">
              <input type="radio" name="stitchMode" id="stitchModeVertical" value="vertical" checked>
              垂直
            </label>
            <label class="radio-label">
              <input type="radio" name="stitchMode" id="stitchModeHorizontal" value="horizontal">
              水平
            </label>
          </div>
        </fieldset>

        <fieldset class="control-group">
          <legend>边距</legend>
          <label class="checkbox-label">
            <input type="checkbox" id="outerBorderInput">
            四边
          </label>
          <label class="slider-row" id="marginSizeRow">边距大小
            <input type="range" id="marginSizeInput" min="0" max="100" step="1" value="20">
            <span class="value-label" id="marginSizeValueLabel" tabindex="0" title="点击输入数值">20px</span>
            <input type="number" class="value-input" id="marginSizeValueInput" min="0" step="1" value="20" hidden>
          </label>
          <label>边距颜色
            <span class="color-input-group">
              <input type="text" id="marginColorHexInput" class="hex-input" maxlength="7" spellcheck="false" placeholder="#RRGGBB">
              <input type="color" id="marginColorInput" value="#ffffff">
            </span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="hslToggleInput">
            HSL
          </label>
          <div id="marginHslControls" hidden>
            <label class="slider-row">色相 H
              <input type="range" id="marginHueInput" min="0" max="360" step="1" value="0">
              <span id="marginHueValue">0</span>
            </label>
            <label class="slider-row">饱和度 S
              <input type="range" id="marginSatInput" min="0" max="100" step="1" value="0">
              <span id="marginSatValue">0%</span>
            </label>
            <label class="slider-row">明度 L
              <input type="range" id="marginLightInput" min="0" max="100" step="1" value="100">
              <span id="marginLightValue">100%</span>
            </label>
          </div>
        </fieldset>

        <fieldset class="control-group">
          <legend>导出尺寸</legend>
          <label><span id="exportSizeLabelText">导出宽度 (px)</span>
            <input type="number" id="exportWidthInput" min="1" placeholder="">
          </label>
          <span class="reference-text" id="exportWidthReference" hidden></span>
        </fieldset>

        <fieldset class="control-group">
          <legend>导出</legend>
          <label>格式
            <select id="exportFormatSelect">
              <option value="image/png">PNG（无损，推荐）</option>
              <option value="image/webp">WebP（体积/质量均衡）</option>
              <option value="image/jpeg" selected>JPEG（体积最小，兼容性好）</option>
            </select>
          </label>
          <label class="slider-row" id="qualityRow" hidden>质量
            <input type="range" id="exportQualityInput" min="0.1" max="1" step="0.01" value="0.92">
            <span id="qualityValueLabel">92%</span>
          </label>
          <button type="button" id="exportButton">导出</button>
          <p class="export-note" id="exportNote" hidden></p>
        </fieldset>

        <fieldset class="control-group" id="imageEditorGroup">
          <legend>图片调整<span id="editorSelectedLabel"></span></legend>
          <p class="reference-text" id="editorEmptyHint">点击图片以调整</p>
          <div id="imageEditorBody" hidden>
            <div id="customCropControls">
              <p class="reference-text">图片可自由裁剪、拖动、缩放</p>
              <label class="checkbox-label"><input type="checkbox" id="centerLockInput"> 居中锁定</label>

              <div id="freeCropControls">
                <div class="crop-preview-wrap">
                  <canvas id="cropPreviewCanvas"></canvas>
                  <div class="crop-resize-handle" id="cropResizeHandle"></div>
                  <div class="crop-resize-handle-h" id="cropResizeHandleH"></div>
                </div>
                <label class="slider-row">缩放
                  <input type="range" id="cropZoomInput" min="1" max="4" step="0.01" value="1">
                </label>
              </div>

              <div id="centerLockControls" hidden>
                <canvas id="cropPreviewCanvasLocked"></canvas>
                <input type="range" id="cropWidthPercentInput" min="0" max="100" step="1" value="100">
              </div>
            </div>

            <div class="editor-actions">
              <button type="button" id="cropResetButton">重置</button>
              <button type="button" id="cropDoneButton">完成</button>
            </div>
          </div>
        </fieldset>

        <fieldset class="control-group mini-preview-group">
          <legend>整体预览</legend>
          <canvas id="miniPreviewCanvas"></canvas>
        </fieldset>
      </aside>
    </div>
  </div>

  <div class="fullscreen-overlay" id="fullscreenOverlay" hidden>
    <button type="button" class="fullscreen-close" id="fullscreenCloseButton" aria-label="关闭全屏预览">×</button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
